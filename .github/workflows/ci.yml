name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests use no network.
      - run: npm test
      # The build fetches nothing from mainnet: every data page is rendered on demand.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
