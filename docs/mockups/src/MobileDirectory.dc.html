<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEAR Hunt — Mobile directory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0A7F5A}a:hover{color:#075E43}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #12161C; display: flex; flex-direction: column;">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <a href="MobileDirectory.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #12161C;">
        <span style="width: 30px; height: 30px; border-radius: 8px; background: #12161C; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        </span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px;">NEAR Hunt</span>
      </a>
      <button type="button" style="font: inherit; font-weight: 600; font-size: 14px; background: #12161C; color: #FFFFFF; border: 0; border-radius: 10px; min-height: 44px; padding: 0 14px;">Connect</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #F5F6F8; border: 1px solid #E3E6EB; border-radius: 10px; padding: 0 12px; min-height: 44px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="mq" style="position: absolute; left: -9999px;">Search projects</label>
      <input id="mq" type="search" placeholder="Search 271 projects" style="border: 0; background: transparent; font: inherit; font-size: 15px; flex: 1; min-width: 0; outline: none;">
    </div>
  </header>

  <div style="display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; flex-shrink: 0;">
    <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 0 14px; min-height: 36px; border: 1px solid #12161C; background: #12161C; color: #FFFFFF; white-space: nowrap;">All</button>
    <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 0 14px; min-height: 36px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #12161C; white-space: nowrap;">Security</button>
    <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 0 14px; min-height: 36px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #12161C; white-space: nowrap;">Agents</button>
    <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 0 14px; min-height: 36px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #12161C; white-space: nowrap;">Real world</button>
    <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 0 14px; min-height: 36px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #12161C; white-space: nowrap;">DeFi</button>
  </div>

  <div style="padding: 0 16px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5A6472;">
    <span>Most upvoted</span>
    <button type="button" style="font: inherit; font-size: 13px; font-weight: 600; background: none; border: 0; color: #12161C; min-height: 32px;">Sort ▾</button>
  </div>

  <ol style="list-style: none; margin: 0; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
    <sc-for list="{{projects}}" as="p" hint-placeholder-count="6">
      <li style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px;">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
          <a href="MobileProject.dc.html" style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: #12161C; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</a>
          <span style="font-size: 13px; color: #5A6472;">{{p.tracks}} · <span style="color: #2557C7;">{{p.comments}} replies</span></span>
        </div>
        <button type="button" aria-pressed="{{p.voted}}" aria-label="Upvote {{p.name}}" style="{{p.voteStyle}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
          <span>{{p.votes}}</span>
        </button>
      </li>
    </sc-for>
  </ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      ['Veto: on-chain spending firewall', 'Security · Agents', 142, 18, true],
      ['SpendGuard AI', 'Business · Security', 117, 9, false],
      ['Clear to Pay', 'Privacy · Business', 98, 12, false],
      ['NEAR Replay Lab', 'Security', 84, 4, true],
      ['Undiluted', 'Privacy · Real world', 71, 7, false],
      ['Setoff', 'Real world · Open', 63, 3, false],
      ['OneShot', 'DeFi · Security', 55, 2, false],
      ['nearbi', 'Thesis · Business', 41, 5, false]
    ];
    var projects = raw.map(function (r) {
      return {
        name: r[0], tracks: r[1], votes: r[2], comments: r[3], voted: r[4] ? 'true' : 'false',
        voteStyle: 'font: inherit; font-weight: 600; font-size: 14px; width: 52px; min-height: 52px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0; ' + (r[4] ? 'background: #0A7F5A; color: #FFFFFF; border: 1px solid #0A7F5A;' : 'background: #FFFFFF; color: #12161C; border: 1px solid #C9CED6;')
      };
    });
    return { projects: projects };
  }
}
</script>
</body>
</html>
